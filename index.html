<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MACHALA Nk - Huambo</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#f0f2f5;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#fff;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #ddd;padding:10px;position:sticky;top:0;z-index:10}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand-main{font-weight:800;font-size:20px}
.brand-main span{color:#1877f2}
.filtro{background:#f0f2f5;padding:8px;border-radius:8px;margin-top:8px;display:flex;gap:6px;overflow-x:auto}
.filtro button{border:none;padding:6px 12px;border-radius:20px;background:#fff;font-weight:700;white-space:nowrap}
.filtro button.ativo{background:#1877f2;color:#fff}
.feed{padding:10px}
.card{border:1px solid #ddd;border-radius:10px;margin-bottom:12px;padding:10px}
.btn{width:100%;padding:10px;background:#1877f2;color:#fff;border:none;border-radius:8px;font-weight:800;margin-top:8px}
input,textarea,select{width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="brand"><div class="brand-main">MACHALA <span>Nk</span></div><button onclick="toggleAuth()">Entrar</button></div>
<div class="filtro">
<button class="ativo" onclick="filtrar('todos',this)">Todos</button>
<button onclick="filtrar('Huambo',this)">Huambo</button>
<button onclick="filtrar('Luanda',this)">Luanda</button>
<button onclick="filtrar('Benguela',this)">Benguela</button>
<button onclick="filtrar('Bié',this)">Bié</button>
<button onclick="filtrar('Huíla',this)">Huíla</button>
</div>
<div style="margin-top:8px">
<input id="leg" placeholder="O que estás a vender? Ex: Nk no Bairro...">
<select id="prov"><option value="Huambo">Huambo</option><option value="Luanda">Luanda</option><option value="Benguela">Benguela</option><option value="Bié">Bié</option><option value="Huíla">Huíla</option></select>
<input type="file" id="file" accept="image/*">
<button class="btn" onclick="publicar()">Publicar Nk</button>
</div>
</div>
<div id="feed" class="feed"></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyAO8d9oR9JV9p8YqXv8Xv8Xv8Xv8Xv8Xv8Xv8X",authDomain:"machala-5min.firebaseapp.com",projectId:"machala-5min"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();const auth=firebase.auth();
const ADMIN_EMAIL="domingosedgar474@gmail.com";
let filtroAtual="todos";
function filtrar(p,el){filtroAtual=p;document.querySelectorAll('.filtro button').forEach(b=>b.classList.remove('ativo'));el.classList.add('ativo');carregarFeed();}
function toggleAuth(){const e=prompt("Email:");const s=prompt("Senha:");if(e&&s)auth.signInWithEmailAndPassword(e,s).catch(()=>auth.createUserWithEmailAndPassword(e,s))}
async function publicar(){const leg=document.getElementById('leg').value;const prov=document.getElementById('prov').value;if(!leg)return alert("Escreve algo!");if(!auth.currentUser)return alert("Entra primeiro!");const file=document.getElementById('file').files[0];let img="";if(file)img=await uploadCloudinary(file);await db.collection('posts').add({leg,prov,img,email:auth.currentUser.email,nome:auth.currentUser.email,likes:0,data:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('leg').value="";carregarFeed();}
async function uploadCloudinary(file){const fd=new FormData();fd.append("file",file);fd.append("upload_preset","machala_preset");const r=await fetch("https://api.cloudinary.com/v1_1/demhx9v0s/image/upload",{method:"POST",body:fd});const j=await r.json();return j.secure_url;}
function carregarFeed(){let q=db.collection('posts').orderBy('data','desc');if(filtroAtual!="todos")q=q.where('prov','==',filtroAtual);q.onSnapshot(s=>{const f=document.getElementById('feed');f.innerHTML="";s.forEach(d=>{const p=d.data();f.innerHTML+=`<div class="card"><b>${p.nome}</b> - ${p.prov||''}<br>${p.leg}<br>${p.img?`<img src="${p.img}" style="width:100%;border-radius:8px;margin-top:6px">`:""}<br><button onclick="curtir('${d.id}')">Curtir (${p.likes||0})</button> ${auth.currentUser&&auth.currentUser.email==ADMIN_EMAIL?`<button onclick="apagar('${d.id}')">Apagar</button>`:""}</div>`})})}
async function curtir(id){if(!auth.currentUser)return alert("Entra!");const d=db.collection('posts').doc(id);const doc=await d.get();await d.update({likes:(doc.data().likes||0)+1})}
async function apagar(id){if(confirm("Apagar?"))await db.collection('posts').doc(id).delete()}
carregarFeed();
</script>
</body>
</html>
